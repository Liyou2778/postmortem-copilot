name: eval-gate

on:
  push:
  pull_request:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/core/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s services/core/tests
      - name: Real-eval artifact gate
        run: python scripts/eval_gate.py --eval eval-real-m9.json
