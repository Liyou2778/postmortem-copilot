apiVersion: v1
kind: Pod
metadata:
  name: io-chaos-client
  namespace: copilot
  labels:
    role: io-chaos-client
spec:
  restartPolicy: Never
  containers:
    - name: writer
      image: postmortem-copilot:m10.7z
      imagePullPolicy: IfNotPresent
      command:
        - python
        - -c
        - |
          import os, time
          while True:
              start = time.perf_counter()
              with open("/data/io-test", "a") as handle:
                  handle.write("x" * 4096)
                  handle.flush()
                  os.fsync(handle.fileno())
              print(round(time.perf_counter() - start, 4), flush=True)
              time.sleep(0.2)
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      emptyDir: {}
