apiVersion: v1
kind: Pod
metadata:
  name: chaos-client
  namespace: copilot
  labels:
    role: chaos-client
spec:
  hostNetwork: true
  restartPolicy: Never
  containers:
    - name: client
      image: postmortem-copilot:m10.7z
      imagePullPolicy: IfNotPresent
      command: ["sleep", "3600"]
