apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: copilot-http-delay
  namespace: copilot
spec:
  mode: all
  selector:
    namespaces:
      - copilot
    labelSelectors:
      app.kubernetes.io/name: postmortem-copilot
      app.kubernetes.io/instance: copilot
  target: Response
  port: 8000
  # no path filter: all HTTP requests
  delay: "300ms"
  duration: "30s"
